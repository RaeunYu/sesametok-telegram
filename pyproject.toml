[project]
name = "sesametok-telegram"
version = "0.1.0"
description = "Telegram client for sesametok-backend: KakaoTalk archive mirror and text sending"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sesametok-telegram = "sesametok_tg.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sesametok_tg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
